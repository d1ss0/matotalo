<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Matotalo – yhteinen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#f3e7cf">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matotalo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf6ea;--ink:#2a2320;--worm:#a2308f;--leaf:#2f9b6e;--soil:#5a3a24}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2b1d14;font-family:'Patrick Hand','Comic Sans MS','Chalkboard SE',cursive;color:var(--ink);overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
#hud{display:flex;gap:4px;padding:5px 6px;background:var(--paper);border-bottom:2px solid var(--ink);align-items:center;font-size:16px;flex-wrap:wrap;row-gap:4px}
#hud::-webkit-scrollbar{display:none}
.stat{display:flex;align-items:center;gap:2px;background:#fff;border:2px solid var(--ink);border-radius:10px 13px 9px 12px;padding:0 6px;white-space:nowrap;line-height:1.35}
.stat b{font-weight:normal;font-size:17px}
.sp{flex:1}
button{font-family:inherit;color:var(--ink);cursor:pointer}
.hbtn{border:2px solid var(--ink);background:#fff;border-radius:10px 12px 10px 13px;font-size:17px;padding:0 8px;line-height:1.35;white-space:nowrap}
#banner{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 20px);z-index:5;pointer-events:none;background:#ffe9a8;border:2px solid var(--ink);border-radius:12px 15px 11px 14px;box-shadow:0 3px 0 rgba(42,35,32,.35);padding:4px 14px;font-size:17px;text-align:center;display:none;line-height:1.2;opacity:.94}
#banner.mini{font-size:15px;padding:2px 10px}
#banner.danger{background:#ffc9c0}
#banner.good{background:#cdeec9}
#stage{flex:1;position:relative;min-height:0;min-width:0;overflow:hidden;background:#2b1d14}
canvas{display:block;touch-action:none;position:absolute;left:0;top:0}
#info{background:var(--paper);border-top:2px solid var(--ink);padding:5px 10px;font-size:16px;height:86px;overflow-y:auto;line-height:1.2}
#info .t{font-size:19px}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:3px}
.bar{font-size:13px;text-align:center}
.bar i{display:block;height:7px;border:1.5px solid var(--ink);border-radius:5px;background:#eee;overflow:hidden;margin-top:1px}
.bar i s{display:block;height:100%;background:var(--leaf)}
#tools{display:flex;gap:6px;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:#e9dfc9;border-top:2px solid var(--ink);scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;min-width:62px;border:2px solid var(--ink);background:#fff;border-radius:12px 14px 11px 13px;padding:3px 5px 2px;text-align:center;font-size:13.5px;line-height:1.05;transition:transform .1s}
.tool .ic{font-size:22px;display:block;line-height:1.15}
.tool .c{display:block;font-size:12.5px;color:#6b5a4a}
.tool.sel{background:#ffe27a;transform:translateY(-3px);box-shadow:0 3px 0 var(--ink)}
.tool.poor .c{color:#c0392b}
#overlay{position:fixed;inset:0;background:rgba(30,20,12,.72);display:flex;align-items:center;justify-content:center;z-index:10;padding:14px}
#overlay .card{background:var(--paper);border:3px solid var(--ink);border-radius:18px 22px 16px 20px;max-width:420px;padding:16px 18px;font-size:17px;line-height:1.3;max-height:92%;overflow:auto}
#overlay h1{margin:0 0 6px;font-size:30px;font-weight:normal;letter-spacing:1px}
#overlay ul{padding-left:20px;margin:6px 0 10px}
#overlay li{margin:3px 0}
.big{font-size:20px;border:2px solid var(--ink);background:#ffe27a;border-radius:12px 14px 12px 15px;padding:4px 16px;margin:4px 6px 0 0}
.small{font-size:15px;border:2px solid var(--ink);background:#fff;border-radius:10px;padding:2px 10px;margin-top:4px}
.clock{position:relative;padding-bottom:6px;gap:4px}
.dayb{position:absolute;left:6px;right:6px;bottom:2px;height:4px;border-radius:2px;background:#ffcf3f}
.dayb s{position:absolute;top:-2px;width:4px;height:8px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
@media (pointer:coarse){.hbtn{min-width:44px;min-height:40px;font-size:21px}}
@media (min-width:700px){
  #hud{font-size:19px;padding:7px 10px;gap:6px}
  .stat{padding:1px 9px}.stat b{font-size:20px}
  .hbtn{font-size:22px;min-width:48px;min-height:42px;padding:0 12px}
  #info{font-size:18px;height:92px}#info .t{font-size:21px}.bar{font-size:15px}
  #banner{font-size:18px}#banner.mini{font-size:16px}
  #overlay .card{max-width:560px;font-size:19px}
}
@media (orientation:landscape) and (min-width:700px){
  body{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  #hud{grid-column:1/3;grid-row:1}
  #tools{grid-column:1;grid-row:2/4;display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:7px;width:184px;padding:8px;overflow-x:hidden;overflow-y:auto;border-top:none;border-right:2px solid var(--ink)}
  #stage{grid-column:2;grid-row:2}
  #info{grid-column:2;grid-row:3}
  .tool{min-width:0;min-height:62px;font-size:14.5px}
  .tool .ic{font-size:25px}
  .tool.sel{transform:none;box-shadow:0 0 0 3px var(--ink)}
}
</style>
</head>
<body>
<div id="hud">
  <span class="stat" title="Multa">🟫 <b id="sMulta">0</b></span>
  <span class="stat" title="Lehdet keittiössä ja ruokakomerossa">🍃 <b id="sLehdet">0</b></span>
  <span class="stat" title="Ruoka-annokset">🍲 <b id="sRuoka">0</b></span>
  <span class="stat" title="Vesi">💧 <b id="sVesi">0</b></span>
  <span class="stat" title="Madot">🪱 <b id="sMadot">0</b></span>
  <span class="stat" title="Tyytyväisyys"><b id="sMood">🙂</b></span>
  <span class="stat" title="Kasvi">🌱 <b id="sKasvi">1</b></span>
  <span class="stat clock" title="Vuorokausi"><b id="sAika">☀️</b><span id="sPaiva">Kevät</span><i class="dayb" id="sDayB"><s id="sDayM"></s></i></span>
  <span class="sp"></span>
  <button class="hbtn" id="bHome" title="Koti">🏠</button>
  <button class="hbtn" id="bZoom" title="Lähennä tai loitonna">🔍</button>
  <button class="hbtn" id="bSpeed">▶︎</button>
  <button class="hbtn" id="bHelp">?</button>
</div>
<div id="stage"><canvas id="cv"></canvas><div id="banner"></div></div>
<div id="info"></div>
<div id="tools"></div>
<div id="overlay" style="display:none"><div class="card" id="card"></div></div>

<script>
'use strict';
// ====== Perusasetukset ======
const COLS=21, ROWS=12, SKY=3, H=ROWS+SKY, SHAFT=10, OFF=SHAFT-4, WK=COLS/9;
const INK='#2a2320';
const ROOMS={
  keittio:{name:'Keittiö',ic:'🍲',cost:10,need:'ruoka',wall:'#f4d6a6',desc:'Madot tuovat lehdet tänne. Kokkimato tekee niistä ruokaa ja multaa, ja nälkäiset madot käyvät syömässä.'},
  komero:{name:'Ruokakomero',ic:'🧺',cost:12,need:null,wall:'#e6d3a8',desc:'Varasto lehdille (30 🍃). Keittiöön mahtuu vain 6 lehteä, joten kerää tänne lehtiä talven varalle – madot hakevat niitä täältä keittiöön.'},
  makuu:{name:'Makuuhuone',ic:'🛏️',cost:8,need:'lepo',wall:'#c8d7ef',desc:'Yöllä madot nukkuvat täällä. Neljä sänkypaikkaa.'},
  kylpy:{name:'Kylpyhuone',ic:'🛁',cost:12,need:'kosteus',wall:'#bfe5ea',desc:'Madot hengittävät ihonsa läpi, joten iho pitää pitää kosteana. Käyttää vettä varastosta.'},
  kellari:{name:'Kellari',ic:'🛢️',cost:15,need:null,wall:'#c6b294',desc:'Kerää sadevettä talteen (+15 vesivarastoa) ja kuivattaa tulvia.'},
  lasten:{name:'Lastenhuone',ic:'🍼',cost:20,need:null,wall:'#f6c8d8',desc:'Kun madot ovat tyytyväisiä, tänne syntyy vauvamatoja.'},
  laakari:{name:'Lääkäri',ic:'🩺',cost:15,need:'terveys',wall:'#e3f1e1',desc:'Parantaa loukkaantuneet madot.'},
  olo:{name:'Olohuone',ic:'📺',cost:10,need:'ilo',wall:'#f2e19f',desc:'Madot rentoutuvat ja ilahtuvat.'},
  askartelu:{name:'Askarteluhuone',ic:'🎨',cost:14,need:'ilo',wall:'#ded0f4',desc:'Puuhaa ja iloa! Antaa enemmän iloa kuin olohuone.'},
  takka:{name:'Takkahuone',ic:'🔥',cost:16,need:'ilo',wall:'#e8c9a0',desc:'Takkatuli pitää pakkasen loitolla lähihuoneista talvella. Madot viihtyvät sen ääressä.'},
  salainen:{name:'Salainen huone',ic:'🗝️',cost:18,need:null,wall:'#4d3f5c',desc:'Turvapaikka: madot piiloutuvat tänne rastaan ja myyrän ajaksi. Mahtuu 4 matoa.'},
};
const NEEDS={ruoka:{ic:'🍃',n:'Ruoka'},kosteus:{ic:'💧',n:'Kosteus'},lepo:{ic:'💤',n:'Lepo'},ilo:{ic:'🎈',n:'Ilo'},terveys:{ic:'❤️',n:'Terveys'}};
const NEED_ROOM={ruoka:['keittio'],kosteus:['kylpy'],lepo:['makuu','olo'],ilo:['askartelu','olo','takka'],terveys:['laakari']};
const NAMES=['Matti','Viivi','Uuno','Siiri','Onni','Liisa','Toivo','Aino','Eemeli','Hilla','Pekka','Mimmi','Väinö','Kerttu','Otto','Iida','Lenni','Saga','Topi','Nelli'];
const FLOOR=.94;
const PLANT_XP=[0,40,120,250,450,700];
const PACE=0.6; // koko pelin perusvauhti (1 = alkuperäinen)

// ====== Satunnaisluvut ======
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(a,b){return mulberry((a*73856093)^(b*19349663)^1234567)();}
const rnd=Math.random;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ====== Tila ======
let G; // pelitila
const DAY=170;let DAYLIGHT=125; // vuorokauden pituus ja valoisan ajan osuus (pelisekunteja); valoisa aika vaihtelee vuodenajan mukaan
const SEASON_DAYS=2,SLEN=DAY*SEASON_DAYS,KCAP=6,PCAP=30,FOOD_CAP=16;
const SEASONS=[
  {id:'kevat',name:'Kevät',ic:'🌱',dl:125,leaf:1,ev:['sade','sade','sade','rastas','myyra'],msg:'🌱 Kevät tuli! Lumi sulaa ja sataa paljon – kellari kerää veden talteen.'},
  {id:'kesa',name:'Kesä',ic:'🌻',dl:142,leaf:1.1,ev:['kuivuus','kuivuus','rastas','rastas','myyra','sade'],msg:'🌻 Kesä! Päivät ovat pitkiä, mutta kuivuus vaanii – pidä vesivarasto täynnä.'},
  {id:'syksy',name:'Syksy',ic:'🍂',dl:118,leaf:3,ev:['sade','rastas','myyra','myyra'],msg:'🍂 Syksy! Lehtiä putoaa isoina kasoina – täytä ruokakomero 🧺 talven varalle ja kaiva syvemmälle!'},
  {id:'talvi',name:'Talvi',ic:'❄️',dl:100,leaf:.25,ev:['myyra'],msg:'❄️ Talvi! Madot pysyvät kotona pakkasrajan alla. Kaivaminen on nyt ilmaista ja mullasta voi löytyä aarteita – ja lumikasoista saa vettä napauttamalla.'}];
const PALS=[
  {far:[150,220,120],near:[104,196,84],grass:[98,200,66],b1:[120,216,84],b2:[84,180,56],out:[42,106,26],leaf:[110,208,72],fl:[1,0,0]},
  {far:[143,212,106],near:[98,184,71],grass:[92,191,58],b1:[111,209,74],b2:[79,174,49],out:[42,106,26],leaf:[98,200,67],fl:[.45,0,0]},
  {far:[226,180,92],near:[204,140,62],grass:[176,160,62],b1:[214,170,70],b2:[190,120,50],out:[110,74,22],leaf:[232,140,48],fl:[0,0,0]},
  {far:[236,242,250],near:[214,226,240],grass:[226,234,244],b1:[240,246,252],b2:[200,214,230],out:[120,140,165],leaf:[150,120,80],fl:[0,0,0]}];
const mix3=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k],rgbS=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
const seasonI=()=>Math.floor(G.time/SLEN)%4, seasonT=()=>G.time%SLEN;
function pal(){const i=seasonI(),k=G.time<SLEN?1:clamp(seasonT()/25,0,1),A=PALS[(i+3)%4],B=PALS[i],o={};for(const key in B)o[key]=mix3(A[key],B[key],k);return o;}
function snowAmt(){const i=seasonI(),t=seasonT();if(i===3)return clamp(t/25,0,1);if(i===0&&G.time>SLEN)return clamp(1-t/30,0,1);return 0;}
// pakkasraja: montako kerrosta pinnasta on jäässä
function frostDepth(){if(seasonI()!==3)return 0;const q=seasonT()/SLEN;return 2.6*clamp(Math.min(q/.3,(1-q)/.12),0,1);}
function nearFire(r,c){for(const rm of G.rooms)if(rm.type==='takka'&&(rm.dmg||0)<60&&Math.hypot(rm.c+1-(c+.5),rm.r-r)<3.2)return true;return false;}
function coldAt(r,c){return r+.5<frostDepth()&&!nearFire(r,c);}
let P=PALS[0],SNOW=0,FROST=0;
let lift={y:1,dir:0,doorT:0};
function newGame(){
  const grid=[];
  for(let r=0;r<ROWS;r++){grid.push([]);for(let c=0;c<COLS;c++)grid[r].push({t:'soil',room:0});}
  for(let r=0;r<ROWS;r++)grid[r][SHAFT].t='shaft';
  const rr=mulberry(Date.now()&0xffff);
  let placed=0,guard=0;
  while(placed<26&&guard++<700){const r=2+Math.floor(rr()*(ROWS-2)),c=Math.floor(rr()*COLS);
    if(c===SHAFT||(r<=2))continue; if(grid[r][c].t==='soil'){grid[r][c].t='rock';placed++;}}
  for(let c=OFF+1;c<=OFF+7;c++)if(c!==SHAFT)grid[1][c].t='tun';
  if(typeof fmat!=='undefined'){fmat.fill(0);fineDirty=true;}
  G={grid,rooms:[],worms:[],multa:40,vesi:10,xp:0,stage:0,time:12,nextEvent:70,ev:null,lastEv:'',
     nextId:1,babyTimer:0,leafTimer:1,flood:0,nameIdx:0,stats:{},wasNight:false};
  const k=roomById(addRoom('keittio',1,OFF+1));k.leaves=5;k.food=4;
  addRoom('makuu',1,OFF+6);
  for(let i=0;i<3;i++)spawnWorm(1,OFF+[3,5,2][i],false);
  spawnWorm(1,OFF+6,true);
  lift={y:1,dir:0,doorT:0};
  assignShifts();
}
function addRoom(type,r,c){
  const id=G.nextId++;
  const rm={id,type,r,c,use:0};if(type==='keittio'){rm.leaves=0;rm.food=0;rm.cook=0;}if(type==='komero')rm.leaves=0;
  G.rooms.push(rm);
  for(const cc of [c,c+1]){G.grid[r][cc].t='tun';G.grid[r][cc].room=id;G.grid[r][cc].mole=false;}
  dirty=true;return id;
}
function roomById(id){return G.rooms.find(x=>x.id===id);}
const broken=rm=>!!rm&&(rm.dmg||0)>=60;
function roomAt(r,c){if(!inB(r,c))return null;const id=G.grid[r][c].room;return id?roomById(id):null;}
function spawnWorm(r,c,baby){
  const name=baby?'Vauvamato':NAMES[G.nameIdx++%NAMES.length];
  const w={id:G.nextId++,name,baby,age:0,x:c+.5,y:SKY+r+FLOOR,trail:[],path:[],state:'idle',timer:rnd()*1.5,
    needs:{ruoka:70+rnd()*30,kosteus:70+rnd()*30,lepo:75+rnd()*25,ilo:70+rnd()*30,terveys:100},
    dir:1,phase:rnd()*6,thought:null,thoughtT:0,room:0,blink:rnd()*4,hue:Math.floor(rnd()*3),
    intent:null,goalRoom:0,leaf:null,carry:false,shift:'day'};
  resetTrail(w);
  G.worms.push(w);return w;
}
function resetTrail(w){w.trail=[];for(let i=0;i<20;i++)w.trail.push({x:w.x-i*.04*(w.dir||1),y:w.y});}

// ====== Ruudukko ======
const inB=(r,c)=>r>=0&&r<ROWS&&c>=0&&c<COLS;
const walk=(r,c)=>inB(r,c)&&(G.grid[r][c].t==='tun'||G.grid[r][c].t==='shaft');
const DIRS=[[0,1],[0,-1],[1,0],[-1,0]];
function adjWalk(r,c){return DIRS.some(([dr,dc])=>walk(r+dr,c+dc));}
function bfs(sr,sc,goal,pass=walk){
  if(!inB(sr,sc))return null;
  const prev=new Int16Array(ROWS*COLS).fill(-2);const q=[sr*COLS+sc];prev[q[0]]=-1;
  for(let qi=0;qi<q.length;qi++){
    const k=q[qi],r=(k/COLS)|0,c=k%COLS;
    if(qi>0&&goal(r,c)){const p=[];let x=k;while(x!==-1&&prev[x]!==-1){p.push([(x/COLS)|0,x%COLS]);x=prev[x];}return p.reverse();}
    for(const [dr,dc] of DIRS){const nr=r+dr,nc=c+dc;if(!inB(nr,nc)||!pass(nr,nc))continue;if(dr&&typeof hasFloor==='function'){const tr=Math.min(r,nr);if(hasFloor(tr,c)&&!ladderAt(tr,c))continue;}const nk=nr*COLS+nc;if(prev[nk]!==-2)continue;prev[nk]=k;q.push(nk);}
  }
  return null;
}
function reachable(sr,sc){const out=[];bfs(sr,sc,(r,c)=>{out.push([r,c]);return false});return out;}
const wCell=w=>[clamp(Math.floor(w.y-SKY),0,ROWS-1),clamp(Math.floor(w.x),0,COLS-1)];
function countRooms(t){return G.rooms.filter(r=>r.type===t).length;}
function waterCap(){return 5+15*G.rooms.filter(r=>r.type==='kellari'&&!broken(r)).length;}
function threat(){return G.ev&&G.ev.phase==='active'&&(G.ev.type==='rastas'||G.ev.type==='myyra');}

// ====== Tulva ======
let floodFrac=new Float32Array(ROWS);
function computeFlood(){
  floodFrac.fill(0);if(typeof fmat==='undefined')return;
  for(let r=0;r<ROWS;r++){let open=0,wat=0;
    for(let fy=(r+SKY)*FD;fy<(r+SKY+1)*FD;fy++)for(let c=0;c<COLS;c++){if(!walk(r,c))continue;for(let fx=c*FD;fx<(c+1)*FD;fx++){const m=fmat[fy*FW+fx];if(m===F_WATER)wat++;if(m!==F_SOIL&&m!==F_ROCK)open++;}}
    floodFrac[r]=open?wat/open:0;}
}
function totalWalk(){let n=0;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(walk(r,c))n++;return n;}
const flooded=(r)=>floodFrac[r]>0.45;

// ====== Pinnan esineet ======
let leaves=[],parts=[],floats=[],rain=[],bird=null,mole=null;
function plantTop(){return SKY-(0.9+G.stage*0.38);}

// ====== Vuorokausi ======
const dayT=()=>G.time%DAY;
const isNight=()=>dayT()>DAYLIGHT;
// yövuorolaiset nukkuvat päivällä, muut yöllä
function sleepTime(w){if(w.shift==='night')return !isNight()&&dayT()>6&&dayT()<DAYLIGHT-6;return isNight();}
function assignShifts(){
  const adults=G.worms.filter(w=>!w.baby);
  const want=adults.length>=3?Math.max(1,Math.round(adults.length/4)):0;
  let night=adults.filter(w=>w.shift==='night');
  for(const w of adults)if(!w.shift)w.shift='day';
  if(night.length<want){for(const w of adults){if(night.length>=want)break;if(w.shift==='day'&&!w.shiftLock){w.shift='night';night.push(w);}}}
  else if(night.length>want){for(const w of night.slice()){if(night.length<=want)break;if(!w.shiftLock){w.shift='day';night.splice(night.indexOf(w),1);}}}
}
function nightAmt(){const t=dayT();if(t>=DAYLIGHT)return 1;if(t>DAYLIGHT-10)return (t-(DAYLIGHT-10))/10;if(t<8)return 1-t/8;return 0;}

// ====== Madon tekoäly ======
function avgNeeds(w){const n=w.needs;return(n.ruoka+n.kosteus+n.lepo+n.ilo+n.terveys)/5;}
function think(w,ic,t=3){w.thought=ic;w.thoughtT=t;}
const kitchens=()=>G.rooms.filter(r=>r.type==='keittio');
const isK=ro=>!!ro&&!broken(ro)&&ro.type==='keittio'&&ro.leaves<KCAP, isP=ro=>!!ro&&!broken(ro)&&ro.type==='komero'&&ro.leaves<PCAP;
// lehdet ensin keittiöön, ja kun se on täynnä, ruokakomeroon
function storeRoute(find){return find((rr,cc)=>isK(roomAt(rr,cc)))||find((rr,cc)=>isP(roomAt(rr,cc)));}
function tryRestock(w){
  const need=kitchens().filter(k=>!broken(k)&&k.leaves<=1);if(!need.length)return false;
  if(G.worms.filter(o=>o!==w&&(o.intent==='restock'||o.fromStore)).length>=need.length)return false;
  const p=route(w,(rr,cc)=>{const ro=roomAt(rr,cc);return !!ro&&!broken(ro)&&ro.type==='komero'&&ro.leaves>0;});if(!p)return false;
  think(w,'🧺',2);go(w,p,'restock');return true;
}
function route(w,goal){const [r,c]=wCell(w);if(goal(r,c))return[];return bfs(r,c,goal);}
function go(w,p,intent,goal){w.intent=intent||null;w.goalRoom=goal||0;w.path=p||[];w.state='walk';if(!w.path.length)arrive(w);}
const TH={ruoka:58,kosteus:58,lepo:35,ilo:50,terveys:60};
function decide(w){
  const [r,c]=wCell(w);
  w.room=0;w.intent=null;
  for(const k of kitchens())if(k.cook===w.id)k.cook=0;
  if(w.leaf&&!w.carry){w.leaf.claim=0;w.leaf=null;}
  // uhka -> piiloon
  if(threat()&&(inDanger(w)||(G.ev.type==='myyra'&&countRooms('salainen')))){
    const here=roomAt(r,c);
    if(here&&here.type==='salainen'&&shelterCount(here.id,w)<4){w.state='hide';w.room=here.id;w.timer=1;return;}
    const p=route(w,(rr,cc)=>{const ro=roomAt(rr,cc);return ro&&ro.type==='salainen'&&shelterCount(ro.id)<4;});
    if(p){const [gr,gc]=p.length?p[p.length-1]:wCell(w);go(w,p,'hide',roomAt(gr,gc).id);think(w,'😱',2);return;}
    if(inDanger(w)){
      const p2=G.ev.type==='rastas'?route(w,(rr)=>rr>=4&&!flooded(rr)):route(w,(rr,cc)=>!mole||Math.hypot(cc+.5-mole.x,rr+SKY+.5-mole.y)>4);
      if(p2){go(w,p2,null);think(w,'😱',2);return;}
    }
  }
  // tulva -> ylös
  if(flooded(r)){const p=route(w,(rr)=>!flooded(rr)&&floodFrac[rr]<.05);if(p){go(w,p,null);think(w,'🌊',2);return;}}
  // kannettava lehti keittiöön
  if(w.carry){const p=storeRoute(g=>route(w,g));if(p){go(w,p,'deliver');return;}}
  const n=w.needs;
  // yö -> nukkumaan
  if(sleepTime(w)&&!threat()&&n.terveys>25&&n.kosteus>20&&n.ruoka>15){goSleep(w);return;}
  // tarpeet
  const order=Object.keys(n).filter(k=>n[k]<TH[k]).sort((a,b)=>n[a]-n[b]);
  for(const nd of order)if(tryNeed(w,nd))return;
  // työt
  if(!w.baby&&!sleepTime(w)){if(tryCook(w))return;if(tryRestock(w))return;if(tryFetch(w))return;}
  // kylmästä lämpimään
  if(coldAt(r,c)){const p=route(w,(rr,cc)=>!coldAt(rr,cc)&&G.grid[rr][cc].t!=='shaft');if(p&&p.length){go(w,p,null);think(w,'🥶',2);return;}}
  // vapaa-aika
  if(n.ilo<85&&rnd()<.35&&tryNeed(w,'ilo',true))return;
  const opts=[[r,c-1],[r,c+1]].filter(([rr,cc])=>walk(rr,cc)&&G.grid[rr][cc].t!=='shaft');
  if(opts.length&&rnd()<.5){go(w,[opts[Math.floor(rnd()*opts.length)]],null);w.timer=2;return;}
  w.state='idle';w.timer=2+rnd()*2.5;
}
function tryNeed(w,nd,quiet){
  const types=NEED_ROOM[nd];
  const ok=ro=>ro&&!broken(ro)&&types.includes(ro.type)&&ro.use<3&&(ro.type!=='keittio'||ro.food>0);
  const here=roomAt(...wCell(w));
  if(ok(here)){startUse(w,here);return true;}
  const p=route(w,(rr,cc)=>ok(roomAt(rr,cc)));
  if(p){const [gr,gc]=p.length?p[p.length-1]:wCell(w);go(w,p,'use',roomAt(gr,gc).id);return true;}
  if(!quiet&&w.needs[nd]<45){
    const noFood=nd==='ruoka'&&countRooms('keittio')>0;
    think(w,(noFood?'🍲':NEEDS[nd].ic)+'?',3.5);if(nd!=='terveys'||w.needs[nd]<30)missingNeed(nd,noFood);}
  return false;
}
function tryCook(w){
  const ok=ro=>ro&&!broken(ro)&&ro.type==='keittio'&&ro.leaves>0&&!ro.cook;
  const p=route(w,(rr,cc)=>ok(roomAt(rr,cc)));if(!p)return false;
  const [gr,gc]=p.length?p[p.length-1]:wCell(w);const rm=roomAt(gr,gc);rm.cook=w.id;
  think(w,'🍳',2);go(w,p,'cook',rm.id);return true;
}
function tryFetch(w,forced){
  if(!G.rooms.some(k=>isK(k)||isP(k)))return false;
  if(seasonI()===3)return false;
  if(threat()&&G.ev.type==='rastas')return false;
  let leaf=forced;
  if(!leaf){const cand=leaves.filter(l=>l.landed&&!l.dead&&!l.claim);if(!cand.length)return false;
    cand.sort((a,b)=>(b.prio-a.prio)||(Math.abs(a.x-SHAFT-.5)-Math.abs(b.x-SHAFT-.5)));leaf=cand[0];}
  const p=route(w,(rr,cc)=>rr===0&&cc===SHAFT);if(!p)return false;
  leaf.claim=w.id;w.leaf=leaf;think(w,'🍃',2);go(w,p,'fetch');return true;
}
function goSleep(w){
  const sleepers=id=>G.worms.filter(o=>o!==w&&o.sleepRoom===id&&(o.state==='sleep'||o.intent==='sleep')).length;
  const bed=warm=>route(w,(rr,cc)=>{const ro=roomAt(rr,cc);return ro&&!broken(ro)&&ro.type==='makuu'&&sleepers(ro.id)<4&&(!warm||!coldAt(rr,cc));});
  const frost=frostDepth()>0;let p=bed(frost);
  if(!p&&frost){const [r,c]=wCell(w);
    if(coldAt(r,c)){const q=route(w,(rr,cc)=>!coldAt(rr,cc)&&G.grid[rr][cc].t!=='shaft');
      if(q&&q.length){w.sleepRoom=0;go(w,q,'sleep',0);think(w,'🥶',2);return;}
      p=bed(false);}}
  if(p){const [gr,gc]=p.length?p[p.length-1]:wCell(w);w.sleepRoom=roomAt(gr,gc).id;go(w,p,'sleep',w.sleepRoom);return;}
  w.sleepRoom=0;w.state='sleep';w.room=0;w.useX=w.x;
}
function arrive(w){
  const [r,c]=wCell(w);const rm=roomAt(r,c);const it=w.intent;w.intent=null;
  w.state='idle';w.timer=.3+rnd()*.5;
  if(it==='hide'){if(rm&&rm.type==='salainen'&&threat()&&shelterCount(rm.id,w)<4){w.state='hide';w.room=rm.id;w.timer=0;}else w.timer=0;}
  else if(it==='use'){if(rm&&rm.id===w.goalRoom&&rm.use<3)startUse(w,rm);}
  else if(it==='sleep'){w.state='sleep';const bed=rm&&rm.type==='makuu';w.room=bed?rm.id:0;w.sleepRoom=w.room;w.useX=bed?rm.c+.35+rnd()*1.3:w.x;}
  else if(it==='cook'){if(rm&&rm.type==='keittio'&&(rm.cook===w.id||!rm.cook)){rm.cook=w.id;w.state='cook';w.room=rm.id;w.timer=3;w.shiftT=0;}}
  else if(it==='fetch'){if(r===0&&c===SHAFT&&w.leaf&&!w.leaf.dead){w.state='waitLift';w.liftFrom=0;w.liftTo=-1;w.afterLift=[];w.waitX=SHAFT+.5+(walk(0,SHAFT+1)?.55:walk(0,SHAFT-1)?-.55:0);think(w,'🛗',99);}else if(w.leaf){w.leaf.claim=0;w.leaf=null;}}
  else if(it==='deliver'){
    if(rm&&(rm.type==='keittio'||rm.type==='komero')&&w.carry){
      const n=w.carryN||1,add=Math.min(n,Math.max(0,(rm.type==='keittio'?KCAP:PCAP)-rm.leaves));
      if(add>0){rm.leaves+=add;floats.push({x:w.x,y:w.y-.4,txt:'+'+add+' 🍃',t:1.4,col:'#2f9b6e'});}
      if(n-add>0)w.carryN=n-add;else{w.carry=false;w.carryN=0;w.fromStore=false;}
      w.timer=0; // jos jäi yli, decide etsii toisen paikan
    }}
  else if(it==='restock'){if(rm&&rm.type==='komero'&&rm.leaves>0&&!w.carry){const n=Math.min(3,rm.leaves);rm.leaves-=n;w.carry=true;w.carryN=n;w.fromStore=true;floats.push({x:w.x,y:w.y-.4,txt:'-'+n+' 🍃',t:1.2,col:'#6b5a4a'});}w.timer=0;}
  w.goalRoom=0;
}
let missingMsgT=0;
function missingNeed(nd,noFood){
  if(missingMsgT>0)return;missingMsgT=14;
  const br=G.rooms.find(r=>NEED_ROOM[nd].includes(r.type)&&broken(r));
  if(br&&!G.rooms.some(r=>NEED_ROOM[nd].includes(r.type)&&!broken(r))){toast(`${NEEDS[nd].ic} ${ROOMS[br.type].name} on rikki – korjaa se 🧱 Paikkaa-työkalulla!`);return;}
  const map={ruoka:noFood?'Keittiössä ei ole ruokaa 🍲 – madot tarvitsevat lehtiä ja kokin keittiöön.':'Madot ovat nälkäisiä 🍃 – rakenna keittiö!',
    kosteus:'Madot kuivuvat 💧 – rakenna kylpyhuone (ja kellari vedelle)!',lepo:'Madot ovat väsyneitä 💤 – tarvitaan makuuhuone.',ilo:'Madoilla on tylsää 🎈 – rakenna olohuone tai askarteluhuone!',terveys:'Joku mato on kipeä ❤️ – rakenna lääkäri!'};
  toast(map[nd]);
}
function inDanger(w){if(!threat())return false;const [r]=wCell(w);if(G.ev.type==='rastas')return w.state==='surface';return !!mole&&Math.hypot(w.x-mole.x,w.y-mole.y)<3.5;}
function shelterCount(id,except){return G.worms.filter(w=>w!==except&&((w.state==='hide'&&w.room===id)||(w.intent==='hide'&&w.goalRoom===id))).length;}
function startUse(w,rm){
  w.state='use';w.room=rm.id;rm.use++;
  w.timer={makuu:6,olo:3.5,askartelu:3.5,takka:3.5,keittio:2.5,kylpy:2.8,laakari:4}[rm.type]||3;
  w.useX=rm.c+.35+rnd()*1.3;w.thought=null;
}
function finishUse(w){
  const rm=roomById(w.room);if(rm)rm.use=Math.max(0,rm.use-1);
  const n=w.needs;const dry=G.ev&&G.ev.type==='kuivuus'&&G.ev.phase==='active';
  if(rm)switch(rm.type){
    case 'keittio':if(rm.food>0){rm.food--;n.ruoka+=55;think(w,'😋',1.5);}else{n.ruoka+=5;think(w,'🍲?',3);}break;
    case 'makuu':n.lepo=100;break;
    case 'olo':n.ilo+=40;n.lepo+=15;break;
    case 'askartelu':n.ilo+=65;break;
    case 'takka':n.ilo+=45;n.lepo+=12;break;
    case 'kylpy':
      if(G.vesi>=1){G.vesi-=1;n.kosteus+=65;floats.push({x:w.x,y:w.y-.4,txt:'-1 💧',t:1.2,col:'#2a6fb0'});}
      else{n.kosteus+=dry?5:20;think(w,'💧?',2.5);toastOnce('vesi','Vesivarasto on tyhjä 💧 – sade täyttää kellarin.');}
      break;
    case 'laakari':n.terveys+=65;break;
  }
  for(const k in n)n[k]=clamp(n[k],0,100);
  if(avgNeeds(w)>80&&rnd()<.4)think(w,'💜',1.8);
  w.room=0;w.state='idle';w.timer=.3+rnd()*.6;
}
function gainMulta(m,x,y){G.multa+=m;G.xp+=m;floats.push({x,y,txt:'+'+m+' 🟫',t:1.6,col:'#5a3a24'});}

// ====== Hissi ======
const LIFT_CAP=4;
function updateLift(dt){
  const L=lift;
  if(L.doorT>0){L.doorT-=dt;return;}
  const stops=new Set();
  for(const w of G.worms){if(w.state==='waitLift')stops.add(w.liftFrom);else if(w.state==='ride')stops.add(w.liftTo);}
  if(!stops.size){L.dir=0;return;}
  for(const r of stops)if(Math.abs(r-L.y)<.01&&liftArrive(r))return;
  const others=[...stops].filter(r=>Math.abs(r-L.y)>=.01);
  if(!others.length)return;
  let cand=L.dir?others.filter(r=>(r-L.y)*L.dir>0):[];
  if(!cand.length)cand=others;
  const target=cand.reduce((a,b)=>Math.abs(b-L.y)<Math.abs(a-L.y)?b:a);
  L.dir=Math.sign(target-L.y);
  const st=2*dt;
  if(Math.abs(target-L.y)<=st){L.y=target;liftArrive(target);}else L.y+=L.dir*st;
}
function liftArrive(row){
  let moved=false;
  for(const w of G.worms)if(w.state==='ride'&&w.liftTo===row){
    if(row<0){w.intent=null;w.state='surface';w.x=SHAFT+.5;w.y=SKY-.08;resetTrail(w);w.sphase=(w.leaf&&!w.leaf.dead&&!w.carry&&!inDanger(w))?'go':'back';if(w.sphase==='back'&&w.leaf&&!w.carry){w.leaf.claim=0;w.leaf=null;}moved=true;continue;}
    w.state='walk';w.x=SHAFT+.5+(rnd()-.5)*.1;w.y=SKY+row+FLOOR;resetTrail(w);w.path=[[row,SHAFT],...(w.afterLift||[])];w.afterLift=null;moved=true;}
  let riders=G.worms.filter(w=>w.state==='ride').length;
  for(const w of G.worms)if(w.state==='waitLift'&&w.liftFrom===row&&riders<LIFT_CAP){w.state='ride';riders++;w.thought=null;moved=true;}
  if(moved)lift.doorT=1.2;
  return moved;
}

// ====== Liike ======
function cellPoint(r,c){return{x:c+.5,y:SKY+r+FLOOR};}
function updateWorm(w,dt){
  w.sq=w.sq||0;w.sqv=w.sqv||0;w.sqv+=(-w.sq*260-w.sqv*14)*dt;w.sq+=w.sqv*dt;
  if((w.state==='walk'||w.state==='use'||w.state==='cook')&&rnd()<dt*3)tramplDirt(w);
  w.phase+=dt*(w.state==='walk'||w.state==='surface'?9:2.5);w.blink-=dt;if(w.blink<-.15)w.blink=2+rnd()*4;
  if(w.thoughtT>0){w.thoughtT-=dt;if(w.thoughtT<=0)w.thought=null;}
  const n=w.needs,sleeping=w.state==='sleep',k=(w.baby?.6:1)*(sleeping?.35:1);
  const ev=G.ev&&G.ev.phase==='active'?G.ev.type:'';
  if(w.state!=='faint'){
    const win=seasonI()===3;
    n.ruoka-=0.75*k*(win?.6:1)*dt;
    let kd=win?.2:.5;if(ev==='kuivuus')kd*=3.2*(1-0.12*G.stage);if(ev==='sade')kd=-2.5;if(w.state==='surface'&&ev!=='sade')kd*=2;
    n.kosteus-=kd*k*dt;
    if(sleeping)n.lepo+=(w.room?10:4)*dt;
    else if(w.state==='use'&&roomById(w.room)?.type==='makuu')n.lepo+=12*dt;
    else n.lepo-=(w.state==='cook'?0.4:0.28)*k*dt;
    n.ilo-=(w.state==='cook'?0.15:0.3)*k*dt;
    const [r,c0]=wCell(w);
    if(flooded(r)&&w.state!=='ride'){n.ilo-=1.5*dt;n.terveys-=0.7*dt;}
    w.cold=w.state==='surface'?SNOW>.5:(w.state!=='ride'&&coldAt(r,c0));
    if(w.cold){n.ilo-=.9*dt;n.lepo-=.4*dt;n.terveys-=.25*dt;w.coldT=(w.coldT||0)+dt;if(w.coldT>6&&!w.thought){w.coldT=0;think(w,'🥶',2);}
      if(!toastSeen.cold||G.time-toastSeen.cold>90){toastSeen.cold=G.time;toast('🥶 Madoilla on kylmä! Kaiva käytäviä ja huoneita pakkasrajan ❄️ alle tai rakenna takkahuone 🔥.');}}
    if(n.ruoka<8||n.kosteus<8)n.terveys-=0.7*dt;else if(n.terveys<100)n.terveys+=(sleeping?.3:.04)*dt;
    for(const kk in n)n[kk]=clamp(n[kk],0,100);
  }
  if(w.baby){w.age+=dt;if(w.age>90){w.baby=false;w.name=NAMES[G.nameIdx++%NAMES.length];think(w,'🎉',2.5);floats.push({x:w.x,y:w.y-.5,txt:w.name+' kasvoi!',t:2,col:'#a2308f'});w.shift='day';assignShifts();}}
  if(n.terveys<=0&&!['faint','ride','surface'].includes(w.state)){
    if(w.state==='use'){const rm=roomById(w.room);if(rm)rm.use=Math.max(0,rm.use-1);}
    for(const kk of kitchens())if(kk.cook===w.id)kk.cook=0;
    w.state='faint';w.timer=8;w.path=[];w.room=0;w.intent=null;think(w,'😵',8);}
  switch(w.state){
    case 'faint':w.timer-=dt;if(w.timer<=0){n.terveys=35;n.kosteus=Math.max(n.kosteus,35);n.ruoka=Math.max(n.ruoka,35);n.ilo=Math.max(0,n.ilo-20);w.state='idle';w.timer=.5;}break;
    case 'idle':w.timer-=dt;if(w.timer<=0)decide(w);break;
    case 'hide':w.timer-=dt;if(!threat()){w.state='idle';w.room=0;w.timer=.5;}
      else{const rm=roomById(w.room);if(rm)moveToward(w,rm.c+.45+(((w.id*37)%10)/10)*1.1,SKY+rm.r+FLOOR,dt);}break;
    case 'sleep':{
      if(w.room){const rm=roomById(w.room);if(rm&&!broken(rm))moveToward(w,w.useX,SKY+rm.r+FLOOR,dt*.5);else w.room=0;}
      if(threat()&&G.ev.type==='myyra'){w.state='idle';w.timer=rnd()*.6;w.room=0;w.sleepRoom=0;think(w,'😨',2);}
      else if(!sleepTime(w)||n.terveys<25||n.kosteus<15||n.ruoka<10){w.state='idle';w.timer=rnd()*2.5;w.room=0;w.sleepRoom=0;think(w,'🥱',1.5);}
      break;}
    case 'use':{w.timer-=dt;const rm=roomById(w.room);if(!rm){w.state='idle';break;}
      moveToward(w,w.useX,SKY+rm.r+FLOOR,dt);if(rnd()<dt*.5)w.useX=rm.c+.35+rnd()*1.3;
      if((threat()&&inDanger(w))||broken(rm)){rm.use=Math.max(0,rm.use-1);w.room=0;w.state='idle';w.timer=0;if(broken(rm))think(w,'🔧?',2.5);break;}
      if(w.timer<=0)finishUse(w);break;}
    case 'cook':{const rm=roomById(w.room);if(!rm){w.state='idle';w.timer=0;break;}
      moveToward(w,rm.c+.5+Math.sin(T*1.5+w.id)*.12,SKY+rm.r+FLOOR,dt*.6);
      w.timer-=dt;w.shiftT+=dt;
      if(w.timer<=0){w.timer=5;if(rm.leaves>0){rm.leaves--;rm.food=Math.min(FOOD_CAP,rm.food+2);gainMulta(5,w.x,w.y-.5);}}
      const low=Object.entries(n).some(([kk,v])=>v<25&&NEED_ROOM[kk].some(t=>t!=='keittio'&&countRooms(t)>0));
      if(rm.leaves<=0||w.shiftT>50||low||sleepTime(w)||inDanger(w)||broken(rm)){rm.cook=0;w.state='idle';w.timer=.3;w.room=0;}
      break;}
    case 'waitLift':moveToward(w,w.waitX,SKY+w.liftFrom+FLOOR,dt*1.1);break;
    case 'ride':{const riders=G.worms.filter(o=>o.state==='ride');const i=riders.indexOf(w);w.slot=i;
      w.x=SHAFT+.5+(i-(riders.length-1)/2)*.17;w.y=SKY+lift.y+.62;break;}
    case 'surface':{
      const dx=SHAFT+.5,sy=SKY-.08,sp=dt*(w.baby?.85:1.1);
      if(w.sphase==='up'){if(moveToward(w,dx,sy,sp*1.3))w.sphase=(w.leaf&&!w.leaf.dead&&!w.carry&&!inDanger(w))?'go':'back';}
      else if(w.sphase==='go'){const l=w.leaf;if(!l||l.dead||inDanger(w)){w.sphase='back';break;}
        if(moveToward(w,l.x,sy,sp)){l.dead=true;w.carry=true;w.carryN=l.n||1;w.fromStore=false;w.leaf=null;think(w,'😊',1.2);w.sphase='back';}}
      else if(w.sphase==='back'){if(moveToward(w,dx,sy,sp*(inDanger(w)?1.6:1))){w.state='waitLift';w.liftFrom=-1;w.liftTo=0;w.afterLift=[];
        if(w.carry){const kp=storeRoute(g=>bfs(0,SHAFT,g));
          if(kp&&kp.length){let j=-1;while(j+1<kp.length&&kp[j+1][1]===SHAFT)j++;w.liftTo=j>=0?kp[j][0]:0;w.afterLift=kp.slice(j+1);w.intent='deliver';w.goalRoom=0;}}
        w.waitX=SHAFT+.5+(w.x<SHAFT+.5?-.62:.62)+((w.id*13)%3)*.12;think(w,'🛗',99);}}
      else{if(moveToward(w,dx,SKY+FLOOR,sp*1.3)){w.state='idle';w.timer=0;resetTrail(w);if(w.leaf&&!w.carry){w.leaf.claim=0;w.leaf=null;}}}
      break;}
    case 'walk':{
      if(!w.path.length){arrive(w);break;}
      const [r,c]=w.path[0];
      if(!walk(r,c)){w.path=[];w.intent=null;w.state='idle';w.timer=.2;break;}
      const [cr,cc]=wCell(w);
      if(cc===SHAFT&&c===SHAFT&&r!==cr&&G.grid[cr][cc].t==='shaft'&&G.grid[r][c].t==='shaft'){
        // hissin vuoro: odotetaan kuilun vieressä
        let j=0;while(j+1<w.path.length&&w.path[j+1][1]===SHAFT&&G.grid[w.path[j+1][0]][SHAFT].t==='shaft')j++;
        w.liftFrom=cr;w.liftTo=w.path[j][0];w.afterLift=w.path.slice(j+1);w.path=[];w.state='waitLift';
        if(w.intent==='fetch'&&w.liftTo===0&&!w.afterLift.length)w.liftTo=-1;
        const sides=[-1,1].filter(sd=>walk(cr,SHAFT+sd));const prefer=(w.trail[8]&&w.trail[8].x<SHAFT+.5)?-1:1;
        const side=sides.includes(prefer)?prefer:(sides[0]||0);
        w.waitX=SHAFT+.5+side*(.5+((w.id*13)%4)*.09);think(w,'🛗',99);
        break;}
      const p=cellPoint(r,c);
      let sp=(w.baby?.85:1.1)*(r!==cr?.8:1)*(w.cold?.75:1);
      if(r>cr&&G.grid[r][c].t!=='shaft'&&!hasFloor(cr,c)){w.fv=Math.min(5,(w.fv||1)+dt*9);sp=Math.max(sp,w.fv);}
      if(moveToward(w,p.x,p.y,dt*sp)){w.path.shift();
        const nx=w.path[0];if(w.fv&&!(nx&&nx[0]>r)){if(w.fv>1.6)w.sqv=(w.sqv||0)+w.fv*1.1;w.fv=0;}
        if(!w.path.length)arrive(w);}
      break;}
  }
  const h=w.trail[0];if(Math.hypot(w.x-h.x,w.y-h.y)>.025){w.trail.unshift({x:w.x,y:w.y});if(w.trail.length>45)w.trail.pop();}
}
function moveToward(w,tx,ty,step){
  const dx=tx-w.x,dy=ty-w.y,d=Math.hypot(dx,dy);
  if(d<=step||d<.01){w.x=tx;w.y=ty;return true;}
  w.x+=dx/d*step;w.y+=dy/d*step;if(Math.abs(dx)>.01)w.dir=dx>0?1:-1;return false;
}

function startEvent(){

  if(!opts.length)opts=seasonI()===3?['myyra']:['rastas','myyra'].filter(t=>t!==G.lastEv);
  let type=opts[Math.floor(rnd()*opts.length)];
  if(G.forceEv){type=G.forceEv;G.forceEv=null;}
  if(seasonI()===3&&(type==='sade'||type==='kuivuus'))type='myyra';
  if(G.stats.firstDone!==true){type='sade';G.stats.firstDone=true;}
  G.ev={type,phase:'warn',t:6};G.lastEv=type;

}
function activateEvent(){

  if(e.type==='rastas'){const sd=rnd()<.5?-1:1;bird={x:clamp(SHAFT+.5+sd*9,-1,COLS+1),tx:SHAFT-2.5+rnd()*6,hp:3,peckT:2.5,peck:0,leave:false,hop:0,dir:-sd,fly:true,arrive:true,alt:1};}
  if(e.type==='myyra'){const left=rnd()<.5;let cl=COLS,ch=0;for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++)if(walk(rr,cc)){cl=Math.min(cl,cc);ch=Math.max(ch,cc);}
    const rows=G.worms.filter(w=>w.state!=='surface').map(w=>wCell(w)[0]);const lo=1,hi=Math.min(ROWS-1,(rows.length?Math.max(...rows):3)+1);
    // myyrä putkahtaa mullasta rakennetun alueen laidalta
    let ec=left?Math.max(0,cl-2):Math.min(COLS-1,ch+2),ok=[];
    for(const k of [0,left?-1:1,left?1:-1,left?-2:2]){const c2=ec+k;if(c2<0||c2>=COLS)continue;ok=[];
      for(let rr=lo;rr<=hi;rr++){const cell=G.grid[rr][c2];if(cell.t!=='rock'&&cell.t!=='shaft'&&!cell.room)ok.push(rr);}
      if(ok.length){ec=c2;break;}}
    const r=ok.length?ok[Math.floor(rnd()*ok.length)]:Math.max(1,hi);const cell=G.grid[r][ec];
    if(cell.t==='soil'){cell.t='tun';cell.mole=true;dirty=true;crumbleQ.push([r,ec,.12]);if(r===1)molehill(ec);}
    shakeT=.5;for(let i=0;i<16;i++)parts.push({x:ec+.5,y:SKY+r+.5,vx:(rnd()-.5)*4,vy:-rnd()*3,t:.8,col:['#a0683a','#c9a070','#6d4524'][i%3]});
    mole={x:ec+.5,y:SKY+r+.62,vy:0,step:null,falling:false,hp:4,hitT:0,leave:false,dir:left?1:-1,dig:0};}
  if(e.type==='rastas'){for(const w of G.worms)if(w.state==='surface')w.sphase='back';}
  if(e.type==='myyra')for(const w of G.worms){
    if(w.state==='surface'){w.sphase='back';continue;}
    if(w.state==='idle'||w.state==='walk'||w.state==='cook'||w.state==='use'){
      if(w.state==='use'){const rm=roomById(w.room);if(rm)rm.use=Math.max(0,rm.use-1);}
      if(w.state==='cook'||(w.state==='use'&&!inDanger(w)&&!countRooms('salainen'))){if(w.state==='use'){const rm=roomById(w.room);if(rm)rm.use++;}continue;}
      w.state='idle';w.timer=rnd()*.5;w.path=[];w.intent=null;}}

function endEvent(){

function molePickGoal(m,forceRandom){
  const opts=[];const ws=G.worms.filter(w=>!['hide','ride','surface','waitLift'].includes(w.state));
  const rms=G.rooms.filter(r=>r.type!=='salainen');const roll=rnd();
  if(!forceRandom&&ws.length&&roll<.5){const w=ws[Math.floor(rnd()*ws.length)];m.goal={worm:w.id};}
  else if(rms.length&&roll<.8){const r=rms[Math.floor(rnd()*rms.length)];m.goal={r:r.r,c:r.c+(rnd()<.5?0:1)};}
  else{for(let k=0;k<20;k++){const r=1+Math.floor(rnd()*(ROWS-1)),c=Math.floor(rnd()*COLS);const cell=G.grid[r][c];if(cell.t==='rock'||(cell.room&&roomById(cell.room)?.type==='salainen'))continue;m.goal={r,c};break;}}
  m.goalT=5+rnd()*4;
}
function moleMove(tx,ty,dt){
  const m=mole,mr=Math.floor(m.y-SKY),mc=Math.floor(m.x);
  if(!m.leave&&inB(mr,mc)){
    const key=mr*COLS+mc;if(key!==m.lastKey){m.lastKey=key;m.stuckT=0;}else m.stuckT=(m.stuckT||0)+dt;
    m.goalT=(m.goalT||0)-dt;m.boldT=Math.max(0,(m.boldT||0)-dt);
    let gx=null,gy=null;if(m.goal){if(m.goal.worm){const w=G.worms.find(o=>o.id===m.goal.worm);if(w&&!['hide','ride','surface','waitLift'].includes(w.state)){gx=w.x;gy=w.y-.3;}}else{gx=m.goal.c+.5;gy=SKY+m.goal.r+.62;}}
    const reached=gx!==null&&Math.hypot(gx-m.x,gy-m.y)<.4;
    if(gx===null||m.goalT<=0||reached||m.stuckT>2.5){if(m.stuckT>2.5){m.boldT=3;m.stuckT=0;}molePickGoal(m,m.boldT>0);
      if(m.goal.worm){const w=G.worms.find(o=>o.id===m.goal.worm);gx=w.x;gy=w.y-.3;}else{gx=m.goal.c+.5;gy=SKY+m.goal.r+.62;}}
    tx=gx;ty=gy;}
  const blocked=(r,c)=>{if(!inB(r,c))return false;const cell=G.grid[r][c];if(cell.t==='rock'||(r===0&&cell.t==='soil'))return true;const rm=cell.room&&roomById(cell.room);return !!(rm&&rm.type==='salainen');};
  if(!m.step){
    // painovoima: avoimessa tilassa myyrä putoaa
    const openBelow=(r,c)=>r<ROWS-1&&walk(r+1,c)&&!G.grid[r+1][c].mole&&!G.grid[r][c].mole;
    if(inB(mr,mc)&&walk(mr,mc)&&(m.falling||openBelow(mr,mc))){
      m.falling=true;m.vy+=9*dt;m.y+=m.vy*dt;
      const nr=Math.min(ROWS-1,Math.floor(m.y-SKY));const fl=SKY+nr+.62;
      if((nr>=ROWS-1||!walk(nr+1,mc)||G.grid[nr+1][mc].mole)&&m.y>=fl){m.y=fl;if(m.vy>2){for(let i=0;i<8;i++)parts.push({x:m.x,y:m.y+.25,vx:(rnd()-.5)*3,vy:-rnd()*1.5,t:.5,col:'#c9a070'});}m.vy=0;m.falling=false;}
      return;}
    const dx=tx-m.x,dy=ty-m.y,cand=[];
    if(!inB(mr,mc)&&!m.leave)cand.push([mr,mc<0?0:COLS-1]);
    else if(m.leave){const sd=m.x<SHAFT+.5?-1:1;cand.push([mr,mc+sd],[mr+1,mc],[mr-1,mc],[mr,mc-sd]);}
    else{if(dy<-.6)cand.push([mr-1,mc]);if(Math.abs(dx)>.3)cand.push([mr,mc+Math.sign(dx)]);if(dy>.6)cand.push([mr+1,mc]);
      cand.push([mr,mc+(m.dir||1)],[mr,mc-(m.dir||1)],[mr-1,mc],[mr+1,mc]);}
    for(const [r,c] of cand){
      if(r<0||r>=ROWS)continue;
      if(c<0||c>=COLS){if(m.leave){m.step={r,c,dig:false};break;}continue;}
      if(blocked(r,c))continue;
      const soil=G.grid[r][c].t==='soil';
      if(r<mr&&!soil&&!G.grid[r][c].mole)continue; // avointa tilaa ei voi kiivetä (omia käytäviä voi)
      if(!soil&&r===mr&&openBelow(r,c)&&!(ty-m.y>.6)&&!(m.boldT>0)&&!m.leave)continue; // ei kävele kuilun reunan yli
      m.step={r,c,dig:soil};
      if(soil){const cell=G.grid[r][c];cell.t='tun';cell.mole=true;dirty=true;crumbleQ.push([r,c,.1]);shakeT=.25;
        if(r===1)molehill(c);}
      break;}
    if(!m.step){if(m.leave){m.leaveStuck=(m.leaveStuck||0)+dt;if(m.leaveStuck>1.2){for(let i=0;i<14;i++)parts.push({x:m.x,y:m.y,vx:(rnd()-.5)*3,vy:-rnd()*2.5,t:.8,col:['#a0683a','#c9a070','#6d4524'][i%3]});m.x=-9;}}return;}
  }
  const st=m.step,gx=st.c+.5,gy=SKY+st.r+.62,sp=(st.dig?.55:1)*(m.leave?1.8:1);
  const ddx=gx-m.x,ddy=gy-m.y,d=Math.hypot(ddx,ddy);if(Math.abs(ddx)>.02)m.dir=Math.sign(ddx);
  if(d<=sp*dt){m.x=gx;m.y=gy;m.step=null;}else{m.x+=ddx/d*sp*dt;m.y+=ddy/d*sp*dt;}
  if(st.dig&&rnd()<dt*6)parts.push({x:m.x+m.dir*.35,y:m.y,vx:m.dir*rnd()*1.2,vy:-rnd()*1.5,t:.5,col:'#a0683a'});
}
function updateEvents(dt){
  if(!G.ev){G.nextEvent-=dt;if(G.nextEvent<=0)startEvent();}
  else{G.ev.t-=dt;if(G.ev.t<=0){if(G.ev.phase==='warn')activateEvent();else endEvent();}}
  const ev=G.ev&&G.ev.phase==='active'?G.ev.type:'';
  // sade

    G.wbuf=(G.wbuf||0)+(inflow-stored)*18;G.lbuf=(G.lbuf||0)+leak*1.4*dt;
    while(G.wbuf>=1){G.wbuf--;spawnRainWater();}while(G.lbuf>=1){G.lbuf--;spawnLeakWater();}
    {const x0=camX/S-1,xw=viewW/S+3;for(let i=0;i<Math.ceil(60*dt*4*Math.max(1,xw/9));i++)rain.push({x:x0+rnd()*xw,y:rnd()*-1,v:9+rnd()*4});}
  }

    else{

      const dx=bird.tx-bird.x;if(Math.abs(dx)>.05){bird.x+=Math.sign(dx)*Math.min(Math.abs(dx),dt*(bird.arrive?4.5:2.2));bird.hop+=dt*12;bird.dir=Math.sign(dx);}else if(bird.arrive){bird.arrive=false;bird.fly=false;}
      if(!bird.arrive)bird.peckT-=dt;
      if(bird.peckT<=0){bird.peckT=2.6;
        const targets=G.worms.filter(w=>w.state==='surface');
        if(targets.length){targets.sort((a,b)=>Math.abs(a.x-bird.x)-Math.abs(b.x-bird.x));const w=targets[0];
          if(Math.abs(w.x-bird.x)<1.2){bird.peck=.5;w.needs.terveys-=28;w.needs.ilo-=15;think(w,'😣',2);floats.push({x:w.x,y:w.y-.5,txt:'Auts!',t:1.4,col:'#c0392b'});
            if(w.state==='surface')w.sphase='back';else if(w.state!=='waitLift'){if(w.state==='use'){const rm=roomById(w.room);if(rm)rm.use=Math.max(0,rm.use-1);}for(const kk of kitchens())if(kk.cook===w.id)kk.cook=0;w.state='idle';w.timer=0;w.path=[];w.intent=null;}}
          else bird.tx=clamp(w.x,.5,COLS-.5);}

    }
  }

    mole.hitT-=dt;mole.dig+=dt;if(mole.leave){mole.leaveT=(mole.leaveT||0)+dt;if(mole.leaveT>3.5&&mole.x>-5){for(let i=0;i<14;i++)parts.push({x:mole.x,y:mole.y,vx:(rnd()-.5)*3,vy:-rnd()*2.5,t:.8,col:'#a0683a'});mole.x=-9;}}
    let tx,ty;

    else{const t=G.worms.filter(w=>w.state!=='hide'&&w.state!=='ride'&&w.state!=='surface').sort((a,b)=>Math.hypot(a.x-mole.x,a.y-mole.y)-Math.hypot(b.x-mole.x,b.y-mole.y))[0];
      if(t){tx=t.x;ty=t.y-.3;}else{tx=mole.x;ty=mole.y;}}

      if(mrm&&mrm.type!=='salainen'&&!mole.leave){const was=broken(mrm);mrm.dmg=Math.min(100,(mrm.dmg||0)+14*dt);
        if(rnd()<dt*8)parts.push({x:mole.x,y:mole.y,vx:(rnd()-.5)*3,vy:-rnd()*2.5,t:.7,col:['#7a5236','#c9b48a','#555'][Math.floor(rnd()*3)]});
        if(!was&&broken(mrm)){toast(`💥 Myyrä rikkoi huoneen: ${ROOMS[mrm.type].name}! Korjaa se 🧱 Paikkaa-työkalulla.`);floats.push({x:mrm.c+1,y:SKY+mrm.r+.3,txt:'💥 Rikki!',t:1.8,col:'#c0392b'});
          if(mrm.type==='keittio'){mrm.leaves=Math.floor(mrm.leaves/2);mrm.food=Math.floor(mrm.food/2);mrm.cook=0;}}}}
    if(mole.leave&&(mole.x<-1.5||mole.x>COLS+1.5))mole=null;
    else if(!mole.leave&&mole.hitT<=0){for(const w of G.worms){if(w.state==='hide'||w.state==='ride'||w.state==='surface')continue;if(Math.hypot(w.x-mole.x,w.y-.28-mole.y)<.6){mole.hitT=1.6;w.needs.terveys-=22;w.needs.ilo-=15;think(w,'😣',2);floats.push({x:w.x,y:w.y-.5,txt:'Auts!',t:1.4,col:'#c0392b'});

  }

function updateWorld(dt){
  // kasvi
  let st=0;for(let i=0;i<PLANT_XP.length;i++)if(G.xp>=PLANT_XP[i])st=i;
  if(st>G.stage){G.stage=st;showBanner(st>=5?'🌸 Kasvi kukkii! Matotalo on upea – rakentamista voi silti jatkaa.':'🌱 Kasvi kasvoi! Uusia lehtiä ja enemmän varjoa kuivalle kaudelle.','good',5);
    for(let i=0;i<14;i++)parts.push({x:SHAFT+.5+(rnd()-.5)*1.5,y:plantTop()+rnd(),vx:(rnd()-.5)*2,vy:-rnd()*2,t:1.2,col:'#7ed957'});}
  // lehdet
  G.leafTimer-=dt;
  const dry=G.ev&&G.ev.phase==='active'&&G.ev.type==='kuivuus';
  if(G.leafTimer<=0&&!isNight()&&seasonI()!==3){const se=SEASONS[seasonI()],au=se.id==='syksy',wi=se.id==='talvi';
    G.leafTimer=Math.max(3.5,(8-G.stage*.9))*(dry?1.8:1)*(.7+rnd()*.6)/se.leaf;
    if(leaves.length<(au?18:9))leaves.push({x:SHAFT-.85+(rnd()-.5)*(au?5:1.2),y:plantTop()+(au?-.2-rnd()*.8:.3),vx:(rnd()-.5)*1.4,vy:0,rot:rnd()*6,landed:false,life:70,sw:rnd()*6,claim:0,prio:false,n:au?3:1,
      col:au?['#e8862e','#d9542b','#e9b93a'][Math.floor(rnd()*3)]:wi?'#b08a4a':null});}
  for(const l of leaves){
    if(!l.landed){l.sw+=dt*3;l.vy=Math.min(l.vy+dt*.9,.9);l.x+=(l.vx+Math.sin(l.sw)*.8)*dt;l.y+=l.vy*dt;l.rot+=dt*Math.sin(l.sw)*2;l.x=clamp(l.x,.3,COLS-.3);
      if(l.y>=SKY-.08){l.y=SKY-.08;l.landed=true;}}
    else if(!l.claim){l.life-=dt;if(l.life<=0)l.dead=true;}
  }
  if(seasonI()===3&&SNOW>.8)for(const l of leaves)if(l.landed&&!l.claim)l.dead=true; // lehdet jäävät lumen alle
  leaves=leaves.filter(l=>!l.dead);
  // talven lumikasat: napauttamalla saa vettä
  if(seasonI()===3&&SNOW>.9){G.piles=G.piles||[];G.pileT=(G.pileT===undefined?6:G.pileT)-dt;
    if(G.pileT<=0){G.pileT=20+rnd()*10;if(G.piles.length<5){let x=0,ok=false;for(let k=0;k<8&&!ok;k++){x=SHAFT+.5+(rnd()<.5?-1:1)*(1.4+rnd()*5);ok=x>.6&&x<COLS-.6&&!G.piles.some(q=>Math.abs(q.x-x)<.9);}if(ok)G.piles.push({x});}}}
  else if(G.piles&&G.piles.length&&seasonI()!==3)G.piles=[];
  // vauvat
  const nl=countRooms('lasten');
  const avg=G.worms.reduce((s,w)=>s+avgNeeds(w),0)/Math.max(1,G.worms.length);
  if(nl>0&&avg>55&&G.worms.length<Math.min(18,4+3*nl)){G.babyTimer+=dt;if(G.babyTimer>32){G.babyTimer=0;

    camX-=mx-pinch.mx;camY-=my-pinch.my;pinch.mx=mx;pinch.my=my;setZoom(pinch.zoom*d/pinch.d,mx,my);return;}
  if(!drag)return;const dx=p.x-drag.x,dy=p.y-drag.y;if(Math.abs(dx)>8||Math.abs(dy)>8)drag.moved=true;
  if(drag.moved){camX=drag.camX-dx;camY=drag.camY-dy;clampCam();}});
function ptrEnd(e,cancel){const p=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);
  if(pinch){pinch=null;const rest=[...ptrs.values()][0];drag=rest?{x:rest.x,y:rest.y,camX,camY,moved:true}:null;return;}
  if(drag&&!drag.moved&&!cancel&&p&&!pinTap(p.x,p.y))tap(p.x+camX,p.y+camY);
  if(!ptrs.size)drag=null;}
cv.addEventListener('pointerup',e=>ptrEnd(e,false));
cv.addEventListener('pointercancel',e=>ptrEnd(e,true));
cv.addEventListener('wheel',e=>{const p=cvPos(e);
  if(e.ctrlKey)setZoom(zoom*Math.exp(-e.deltaY*.01),p.x,p.y);
  else{camX+=e.deltaX+(e.shiftKey?e.deltaY:0);camY+=e.shiftKey?0:e.deltaY;clampCam();}
  e.preventDefault();},{passive:false});
for(const t of ['gesturestart','gesturechange'])document.addEventListener(t,e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(document.getElementById('overlay').style.display!=='none')return;const k=e.key,st=S*.8;
  if(k==='ArrowLeft')camX-=st;else if(k==='ArrowRight')camX+=st;else if(k==='ArrowUp')camY-=st;else if(k==='ArrowDown')camY+=st;
  else if(k==='+'||k==='=')setZoom(zoom*1.15,viewW/2,viewH/2);else if(k==='-')setZoom(zoom/1.15,viewW/2,viewH/2);else return;
  clampCam();e.preventDefault();});

function wormInfo(){
  const w=G.worms.find(x=>x.id===selWorm);if(!w){selWorm=0;return false;}
  const gr=roomById(w.goalRoom),rn=r=>r?ROOMS[r.type].name.toLowerCase():'';
  const walkTxt={fetch:'menee hakemaan lehteä',deliver:'vie lehtiä varastoon',restock:'hakee lehtiä ruokakomerosta',cook:'menee kokiksi',sleep:'menee nukkumaan',use:'menee: '+rn(gr),hide:'pakenee piiloon'}[w.intent]||'liikkeellä';
  const st={walk:walkTxt,idle:'miettii',use:'puuhailee: '+rn(roomById(w.room)),hide:'piilossa',faint:'pyörtynyt – lepää hetken',
    sleep:'nukkuu'+(w.room?' sängyssä':''),cook:'kokkaa lehdistä ruokaa ja multaa',waitLift:'odottaa hissiä',ride:'matkustaa hississä',
    surface:w.carry?'tuo lehteä kotiin':'hakee lehteä pinnalta'}[w.state]||'';
  const sh=w.baby?'':` · ${w.shift==='night'?'🌙 yövuoro':'☀️ päivävuoro'}`;
  let h=`<span class="t">🪱 ${w.name}</span> ${w.baby?'(kasvaa)':''} – ${st}${sh}<div class="bars">`;
  for(const k in NEEDS){const v=w.needs[k];h+=`<div class="bar">${NEEDS[k].ic} ${NEEDS[k].n}<i><s style="width:${v}%;background:${v<30?'#e74c3c':v<55?'#f1c40f':'#2f9b6e'}"></s></i></div>`;}
  setInfo(h+'</div>');return true;
}
function updateHUD(){
  const $=id=>document.getElementById(id);
  $('sMulta').textContent=Math.floor(G.multa);$('sLehdet').textContent=G.rooms.reduce((a,k)=>a+(k.leaves||0),0);$('sRuoka').textContent=kitchens().reduce((a,k)=>a+k.food,0);$('sAika').textContent=isNight()?'🌙':dayT()>DAYLIGHT-15?'🌇':dayT()<10?'🌅':'☀️';{const se=SEASONS[seasonI()],pc=(DAYLIGHT/DAY*100).toFixed(1);$('sPaiva').textContent=se.ic+' '+se.name+' '+(Math.floor(seasonT()/DAY)+1)+'/'+SEASON_DAYS;$('sPaiva').parentNode.title='Päivä '+(Math.floor(G.time/DAY)+1)+', vuosi '+(Math.floor(G.time/SLEN/4)+1);$('sDayB').style.background=`linear-gradient(90deg,#ffcf3f 0 ${pc}%,#27336e ${pc}% 100%)`;}$('sDayM').style.left=(dayT()/DAY*100).toFixed(1)+'%';$('sVesi').textContent=Math.floor(G.vesi)+'/'+waterCap();

  $('sMood').textContent=(avg>75?'😄':avg>55?'🙂':avg>35?'😐':'😟')+Math.round(avg)+'%';
  $('sKasvi').textContent=(G.stage+1)+'/6';
  document.querySelectorAll('.tool').forEach(b=>{const t=TOOLS.find(x=>x.id===b.dataset.id);b.classList.toggle('poor',!!t.cost&&G.multa<t.cost);});
  {const kb=document.querySelector('.tool[data-id="kaiva"] .c');if(kb){const tx=seasonI()===3?'ilmainen ❄️':'1 🟫';if(kb.textContent!==tx)kb.textContent=tx;}}
  if(selWorm)wormInfo();

// ====== Tallennus ======
const KEY='matotalo-v5';
// vanha kapea talo siirretään uuden puutarhan keskelle
function migrateV4(){try{const s=localStorage.getItem('matotalo-v4');if(!s)return null;const g=JSON.parse(s);if(!g.grid||g.grid.length!==ROWS||g.grid[0].length!==9)return null;
  const rr=mulberry(777),grid=[];
  for(let r=0;r<ROWS;r++){grid.push([]);for(let c=0;c<COLS;c++){const oc=c-OFF;grid[r].push(oc>=0&&oc<9?g.grid[r][oc]:{t:r>2&&rr()<.1?'rock':'soil',room:0});}}
  g.grid=grid;for(const rm of g.rooms)rm.c+=OFF;
  for(const w of g.worms){w.x+=OFF;for(const q of w.trail||[])q.x+=OFF;if(w.useX)w.useX+=OFF;if(w.waitX)w.waitX+=OFF;}
  return JSON.stringify(g);}catch(e){return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({...G,worms:G.worms.map(w=>({...w,trail:[w.trail[0]],path:[],leaf:null,afterLift:null}))}));}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY)||migrateV4();if(!s)return false;const g=JSON.parse(s);if(!g.grid||g.grid.length!==ROWS||g.grid[0].length!==COLS)return false;G=g;
  for(const w of G.worms){
    if(w.state==='ride'||w.state==='waitLift'){const p=cellPoint(Math.max(0,w.state==='ride'?w.liftTo:w.liftFrom),SHAFT);w.x=p.x;w.y=p.y;}
    if(w.state==='surface'){const p=cellPoint(0,SHAFT);w.x=p.x;w.y=p.y;}
    if(w.state!=='sleep'&&w.state!=='faint'){w.state='idle';w.room=0;}
    w.path=[];w.intent=null;w.leaf=null;resetTrail(w);}
  for(const r of G.rooms){r.use=0;if(r.type==='keittio')r.cook=0;for(const cc of [r.c,r.c+1])G.grid[r.r][cc].mole=false;}
  for(const w of G.worms)if(!w.shift)w.shift='day';assignShifts();if(G.ev&&G.ev.phase==='active'){G.ev=null;G.nextEvent=20;}return true;}catch(e){return false;}}

document.getElementById('bHelp').onclick=()=>help(false);

// ====== Pääsilmukka ======
let last=performance.now(),saveT=0,hudT=0;
function step(dt){
  G.time+=dt;T+=dt;
  const nt=isNight();
  if(nt!==G.wasNight){G.wasNight=nt;
    assignShifts();
    if(nt){const nn=G.worms.filter(w=>w.shift==='night').length;
      showBanner('🌙 Yö tulee – päivävuoro menee nukkumaan'+(nn?`, ${nn} yövuorolaista jatkaa töitä.`:'.'),'',5);
      for(const w of G.worms){if(w.shift==='night'||w.carry||w.state==='surface'||w.state==='ride'||w.state==='waitLift'||w.state==='hide'||w.state==='faint')continue;
        if(w.state==='use'){const rm=roomById(w.room);if(rm)rm.use=Math.max(0,rm.use-1);}
        for(const kk of kitchens())if(kk.cook===w.id)kk.cook=0;
        w.state='idle';w.timer=rnd()*3;w.path=[];w.intent=null;}}
    else{showBanner('☀️ Aamu! Päivävuoro herää, yövuoro menee nukkumaan.','good',4);
      for(const w of G.worms)if(w.shift==='night'&&['idle','walk','use','cook'].includes(w.state)&&!w.carry&&w.intent!=='deliver'){
        if(w.state==='use'){const rm=roomById(w.room);if(rm)rm.use=Math.max(0,rm.use-1);}
        for(const kk of kitchens())if(kk.cook===w.id)kk.cook=0;
        w.state='idle';w.timer=rnd()*3;w.path=[];w.intent=null;}}}
  {const si=seasonI();DAYLIGHT=SEASONS[si].dl;
    if(G.season!==si){const first=G.season===undefined;G.season=si;
      if(!first){showBanner(SEASONS[si].msg,'good',10);
        if(si===3)for(const w of G.worms)if(w.state==='surface')w.sphase='back';
        if(si===0&&!G.ev){G.forceEv='sade';G.nextEvent=Math.min(G.nextEvent,10);}}}}
  SNOW=snowAmt();
  updateEvents(dt);updateWorld(dt);updateLift(dt);
  for(const w of G.worms)updateWorm(w,dt);
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)hideBanner();}
  if(bannerShortT>0){bannerShortT-=dt;if(bannerShortT<=0&&bannerShort){const b=document.getElementById('banner');b.textContent=bannerShort;b.classList.add('mini');}}
  if(infoLock>0)infoLock-=dt;
}
function frame(now){
  let dt=Math.min(.1,(now-last)/1000);last=now;
  if(!paused){for(let i=0;i<speed;i++)stepCA();computeFlood();shakeT=Math.max(0,shakeT-dt);}
  if(!paused){const sdt=dt*speed*PACE;const n=Math.ceil(sdt/.05);for(let i=0;i<n;i++)step(sdt/n);}
  else T+=dt*.3;
  render();
  hudT-=dt;if(hudT<=0){hudT=.25;updateHUD();if(!selWorm&&infoLock<=0&&!document.getElementById('info').dataset.static){}}
  saveT+=dt;if(saveT>8){saveT=0;save();}
  requestAnimationFrame(frame);
}

window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});

if(!seen)help(true);

requestAnimationFrame(frame);
